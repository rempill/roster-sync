name: RosterSync demo
on:
  workflow_dispatch:
  push:
    paths:
      - "branch*/**"
  pull_request:
    paths:
      - "branch*/**"
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose -f branch6/compose.yml up --build -d --wait --wait-timeout 180
      - run: docker compose -f branch6/compose.yml exec -T matching python -m unittest -v test_matching test_scheduling
      - run: docker compose -f branch6/compose.yml exec -T core node checks/integration.mjs
      - run: npm ci --prefix branch6
      - run: node branch6/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - run: node branch6/checks/browser.mjs
      - if: always()
        run: docker compose -f branch6/compose.yml logs --tail 100
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-captures
          path: branch6/artifacts/
      - if: always()
        run: docker compose -f branch6/compose.yml down
