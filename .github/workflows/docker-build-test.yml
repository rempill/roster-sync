name: Docker build test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f deployments/docker-compose.yml config --quiet
      - name: Build scaffold images
        run: docker compose -f deployments/docker-compose.yml build
